<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#C19A2F" />

  <!-- Keep these in sync with `profile` in src/data/portfolio.ts -->
  <title>Pratyush</title>
  <meta name="description"
    content="Portfolio of Pratyush Singh, Backend &amp; Applied ML Engineer based in Bangalore." />

  <!-- Social link previews (LinkedIn, X, Slack, WhatsApp, iMessage, Discord).
       og:image must be a PNG or JPEG — those platforms will not render SVG.
       Once you have a domain, make og:image and og:url absolute URLs, e.g.
       https://yoursite.com/images/og-cover.png — many scrapers ignore
       relative paths. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pratyush Singh — Backend &amp; Applied ML Engineer" />
  <meta property="og:description"
    content="Portfolio of Pratyush Singh, Backend &amp; Applied ML Engineer based in Bangalore." />
  <meta property="og:image" content="/images/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <!-- <meta property="og:url" content="https://yoursite.com/" /> -->
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts: preconnect first so the font request starts during HTML parse. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
