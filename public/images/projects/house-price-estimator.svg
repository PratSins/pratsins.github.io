<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img"
     aria-label="House Price Estimator — the prediction form beside an illustration of a house, a rising price trend and a neural network">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#eef1f0"/><stop offset="100%" stop-color="#d9e0de"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#7cc39a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f9d78" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dfe7e4" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#sky)"/>

  <!-- city skyline, far back -->
  <g fill="#2f4f45" opacity="0.075">
    <rect x="600" y="330" width="70" height="276"/><rect x="682" y="392" width="52" height="214"/>
    <rect x="978" y="300" width="76" height="306"/><rect x="1066" y="366" width="58" height="240"/>
    <rect x="1128" y="420" width="52" height="186"/><rect x="746" y="440" width="44" height="166"/>
  </g>

  <!-- rising trend arrow, behind the house -->
  <g>
    <path d="M606 600 L943 313" stroke="url(#arrow)" stroke-width="46" fill="none"/>
    <path d="M1002 262 L971 346 L914 279 Z" fill="#4f9d78" opacity="0.85"/>
  </g>

  <!-- house -->
  <g stroke="#2f4f45" stroke-width="3.5" stroke-linejoin="round" fill="url(#wall)">
    <path d="M700 402 L852 286 L1004 402"/>
    <rect x="726" y="402" width="252" height="204"/>
    <rect x="944" y="316" width="34" height="60" fill="#dfe7e4"/>
  </g>
  <g stroke="#2f4f45" stroke-width="3" fill="none">
    <rect x="826" y="500" width="52" height="106"/>
    <rect x="756" y="446" width="46" height="46"/><rect x="902" y="446" width="46" height="46"/>
    <circle cx="852" cy="356" r="24"/><path d="M828 356h48M852 332v48"/>
    <circle cx="866" cy="556" r="5" fill="#2f4f45"/>
  </g>
  <path d="M676 606h352" stroke="#2f4f45" stroke-width="4" stroke-linecap="round"/>

  <!-- neural network glyph -->
  <g stroke="#4f9d78" stroke-width="2.4" fill="#4f9d78">
    <g opacity="0.9">
      <path d="M1012 150 L1064 122 M1012 150 L1064 178 M1012 202 L1064 122 M1012 202 L1064 178 M1064 122 L1116 150 M1064 178 L1116 150"/>
      <circle cx="1012" cy="150" r="6.5"/><circle cx="1012" cy="202" r="6.5"/>
      <circle cx="1064" cy="122" r="6.5"/><circle cx="1064" cy="178" r="6.5"/>
      <circle cx="1116" cy="150" r="6.5"/>
    </g>
  </g>

  <!-- rupee mark -->
  <g stroke="#2f4f45" stroke-width="3.8" fill="none" stroke-linecap="round">
    <path d="M846 112h48M846 136h48M888 112c0 22-15 24-33 24l42 46"/>
  </g>

  <!-- prediction line chart -->
  <g fill="none" stroke="#4f9d78" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M996 674 L1042 646 L1088 658 L1134 610"/>
  </g>
  <g fill="#4f9d78">
    <circle cx="996" cy="674" r="5"/><circle cx="1042" cy="646" r="5"/>
    <circle cx="1088" cy="658" r="5"/><circle cx="1116" cy="604" r="5"/>
  </g>

  <!-- ============ the actual app UI ============ -->
  <g>
    <rect x="66" y="86" width="452" height="580" rx="18" fill="#2f4f45" opacity="0.13"/>
    <rect x="60" y="80" width="452" height="580" rx="18" fill="#9d6b63"/>

    <text x="92" y="132" font-family="Helvetica" font-size="19" font-weight="bold" fill="#1d1512">Area (Square Feet)</text>
    <rect x="92" y="146" width="388" height="42" rx="7" fill="#f4f2ee"/>
    <text x="110" y="174" font-family="Helvetica" font-size="17" fill="#3b3532">1000</text>

    <text x="92" y="232" font-family="Helvetica" font-size="19" font-weight="bold" fill="#1d1512">BHK</text>
    <g>
      <rect x="92" y="246" width="252" height="38" rx="5" fill="#e9e6e0" stroke="#8a837c"/>
      <rect x="142" y="246" width="50" height="38" fill="#9ad98f"/>
      <path d="M142 246v38M192 246v38M242 246v38M292 246v38" stroke="#8a837c"/>
      <g font-family="Helvetica" font-size="16" fill="#2a2522" text-anchor="middle">
        <text x="117" y="271">1</text><text x="167" y="271">2</text><text x="217" y="271">3</text>
        <text x="267" y="271">4</text><text x="318" y="271">5</text>
      </g>
    </g>

    <text x="92" y="332" font-family="Helvetica" font-size="19" font-weight="bold" fill="#1d1512">Bath</text>
    <g>
      <rect x="92" y="346" width="252" height="38" rx="5" fill="#e9e6e0" stroke="#8a837c"/>
      <rect x="142" y="346" width="50" height="38" fill="#9ad98f"/>
      <path d="M142 346v38M192 346v38M242 346v38M292 346v38" stroke="#8a837c"/>
      <g font-family="Helvetica" font-size="16" fill="#2a2522" text-anchor="middle">
        <text x="117" y="371">1</text><text x="167" y="371">2</text><text x="217" y="371">3</text>
        <text x="267" y="371">4</text><text x="318" y="371">5</text>
      </g>
    </g>

    <text x="92" y="432" font-family="Helvetica" font-size="19" font-weight="bold" fill="#1d1512">Location</text>
    <rect x="92" y="446" width="388" height="42" rx="7" fill="#f4f2ee"/>
    <text x="110" y="474" font-family="Helvetica" font-size="17" fill="#3b3532">1st block jayanagar</text>
    <path d="M452 462l8 9 8-9" stroke="#3b3532" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="92" y="522" width="388" height="46" rx="7" fill="#9ad98f"/>
    <text x="286" y="551" font-family="Helvetica" font-size="18" font-weight="600" fill="#1d2b1c" text-anchor="middle">Estimate Price</text>

    <rect x="92" y="588" width="388" height="46" rx="7" fill="#e8e08a"/>
    <text x="286" y="619" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2a2410" text-anchor="middle">201.99 Lakh</text>
  </g>
</svg>
